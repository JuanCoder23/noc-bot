name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first version to fail cancels the others, and a
      # failure specific to one Node version can stay hidden behind an
      # unrelated one that happened to finish first.
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test

  workflow-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the n8n workflow export
        run: node scripts/validate-workflow.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Unlike the test job, this one has a dependency to install: eslint.
      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json disagree.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
